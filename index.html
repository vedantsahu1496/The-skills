<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Skills - Online Learning Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f1020;
            color: #ffffff;
            padding-bottom: 50px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 16, 32, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-login {
            background: transparent;
            border: 1px solid #7928ca;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .hero {
            text-align: center;
            padding: 30px 20px;
        }
        .hero h1 {
            font-size: 22px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #fff, #b19cd9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 13px;
            color: #aaa;
        }
        .container {
            padding: 0 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .package-card {
            background: linear-gradient(135deg, #1a1c38, #281c3d);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .package-img {
            width: 100%;
            height: 160px;
            background: #1e1f38;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .package-content {
            padding: 18px;
        }
        .package-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #d8b4fe;
        }
        .package-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 18px 0;
            font-size: 13px;
            color: #bbb;
        }
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-box span {
            font-size: 12px;
            color: #888;
            text-decoration: line-through;
            margin-right: 6px;
        }
        .price-box strong {
            font-size: 20px;
            color: #22c55e;
        }
        .btn-buy {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.4);
        }
        /* Login Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #161832;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 350px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .modal-content h2 { margin-bottom: 15px; font-size: 20px; color: #d8b4fe; }
        .modal-content input {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            background: #0f1020;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        .modal-content button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .close-modal {
            margin-top: 12px;
            display: inline-block;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">The Skills</div>
        <div class="nav-buttons">
            <button class="btn-login" onclick="openLogin()">Student Login</button>
        </div>
    </header>

    <div class="hero">
        <h1>Choose Your Course Package</h1>
        <p>Learn high-income skills & build your future</p>
    </div>

    <div class="container" id="courseList"></div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>Student Login</h2>
            <input type="email" id="loginEmail" placeholder="Enter Email ID">
            <input type="password" id="loginPassword" placeholder="Enter Password">
            <button onclick="handleLogin()">Login to Dashboard</button>
            <span class="close-modal" onclick="closeLogin()">Cancel</span>
        </div>
    </div>

    <script>
        const courses = [
            {
                title: "Intermediate Package",
                coursesCount: "4 Courses",
                rating: "★★★★☆",
                price: "₹560",
                originalPrice: "₹999",
                imgText: "Intermediate Mastery Box"
            },
            {
                title: "Master Package",
                coursesCount: "15 Courses",
                rating: "★★★★★",
                price: "₹2,499",
                originalPrice: "₹5,999",
                imgText: "Master Business Package"
            },
            {
                title: "Brahmastra Package",
                coursesCount: "25+ Courses",
                rating: "★★★★★",
                price: "₹3,999",
                originalPrice: "₹9,999",
                imgText: "Brahmastra Ultimate Box"
            }
        ];

        const container = document.getElementById('courseList');

        courses.forEach(course => {
            const card = document.createElement('div');
            card.className = 'package-card';
            card.innerHTML = `
                <div class="package-img">${course.imgText}</div>
                <div class="package-content">
                    <div class="package-title">${course.title}</div>
                    <div style="font-size:12px; color:#fbbf24; margin-bottom:5px;">${course.rating}</div>
                    <div class="package-info">
                        <span>📚 ${course.coursesCount}</span>
                        <span>⚡ Lifetime Access</span>
                    </div>
                    <div class="action-row">
                        <div class="price-box">
                            <span>${course.originalPrice}</span><strong>${course.price}</strong>
                        </div>
                        <button class="btn-buy" onclick="buyCourse('${course.title}', '${course.price}')">Buy Now</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        function buyCourse(courseName, price) {
            const phoneNumber = "919876543210"; // Yahan apna WhatsApp number daal dena
            const message = `Hello, I want to buy the *${courseName}* for *${price}*. Please share payment details.`;
            window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function openLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLogin() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            if(email && pass) {
                alert("Login successful! Redirecting to Student Dashboard...");
                closeLogin();
            } else {
                alert("Please enter both email and password!");
            }
        }
    </script>
</body>
</html>
