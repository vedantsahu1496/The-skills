<!DOCTYPE html>
<html>
<body style="background:#050811;color:#fff;font-family:Arial;padding:20px">
  <h2 id="st" style="color:#f87171">JS NOT RUNNING</h2>
  <button id="b1" type="button" style="padding:14px 20px;font-size:18px;background:#fbbf24;color:#000;border:none;border-radius:8px">☰ Test Button</button>
  <script>
    var st = document.getElementById("st");
    var b1 = document.getElementById("b1");
    st.textContent = "JS IS RUNNING!";
    st.style.color = "#4ade80";
    b1.onclick = function() {
      document.body.style.background = document.body.style.background === "rgb(20, 40, 29)" ? "#050811" : "#14281d";
      st.textContent = "BUTTON CLICK WORKED!";
    };
  </script>
</body>
</html>
